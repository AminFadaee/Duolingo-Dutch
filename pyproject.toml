[project]
name = "duolingo-anki"
version = "0.1.0"
description = "Dutch vocabulary from the Duolingo wiki with forms, example sentences and audio for Anki"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Amin", email = "amenfd@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
duolingo-anki = "duolingo_anki:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
pipeline = [
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "sacremoses>=0.2.0",
    "sentencepiece>=0.2.2",
    "soundfile>=0.14.0",
    "supertonic>=1.3.1",
    "torch>=2.14.1",
    "transformers>=5.18.0",
]

[tool.uv]
default-groups = ["dev", "pipeline"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
