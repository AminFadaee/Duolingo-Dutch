[project]
name = "duolingo-anki"
version = "0.1.0"
description = "Scrape Dutch vocabulary from the Duolingo wiki for Anki"
authors = [
    { name = "Amin", email = "amenfd@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.3",
]

[project.scripts]
duolingo-anki = "duolingo_anki:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
